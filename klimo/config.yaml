name: Klimo
version: "0.2.4"
slug: klimo
description: Room-by-room heating and cooling with flexible climate sources, schedules and native HA entities
url: https://github.com/RobinCK/klimo
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant: "2025.10.0"
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat
panel_title: Klimo
# household members use the panel; configuration changes are limited to HA admins inside Klimo
panel_admin: false
hassio_api: true
homeassistant_api: true
services:
  - mqtt:want
watchdog: "http://[HOST]:[PORT:8099]/api/health"
backup_pre: "/app/backup-hook.sh pre"
backup_post: "/app/backup-hook.sh post"
map:
  - type: addon_config
    read_only: false
  - type: homeassistant_config
    read_only: false
options:
  log_level: info
  database:
    driver: sqlite
schema:
  log_level: list(trace|debug|info|warning|error)?
  database:
    driver: list(sqlite|mariadb|postgres)?
    host: str?
    port: port?
    name: str?
    username: str?
    password: password?
  telegram_bot_token: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
